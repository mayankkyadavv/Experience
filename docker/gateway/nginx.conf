# Routes the hosted Supabase URL shape to the local services. The apikey header is not checked locally.
server {
  listen 8000;
  client_max_body_size 10m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 160s;

  location /auth/v1/      { proxy_pass http://auth:9999/; }
  location /rest/v1/      { proxy_pass http://rest:3000/; }
  location /functions/v1/ { proxy_pass http://functions:9000/; }

  location = / {
    default_type application/json;
    return 200 '{"ok":true,"routes":["/auth/v1","/rest/v1","/functions/v1"]}';
  }
}
