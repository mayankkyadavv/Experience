# Local backend: the same Supabase pieces the hosted project runs (ADR-002), trimmed to what Experience uses.
#
#   docker compose up -d                      # API on :54321, Postgres on :54322, Studio on :54323
#   docker compose run --rm tools deno task smoke   # sign up, pick Philadelphia, ask for recommendations
#   docker compose run --rm tools deno task test    # Deno tests
#   docker compose down -v                    # stop and wipe the database
#
# Ports match the Supabase CLI so `supabase start` is a drop-in replacement. Production stays hosted Supabase;
# this file is for local development only. Keys below are local-only defaults; override them in a root `.env`.
# Image versions come from supabase/supabase docker/docker-compose.yml (2026-10).
# Decision 2026-10-21: everything runs locally until the app is ready; hosted Supabase comes later.

name: experience

x-keys: &keys
  JWT_SECRET: ${JWT_SECRET:-experience-local-dev-jwt-secret-not-for-production-use}
  ANON_KEY: &anon ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6ImV4cGVyaWVuY2UtbG9jYWwiLCJpYXQiOjE3NjAwMDAwMDAsImV4cCI6MjI0MDAwMDAwMH0.q95zZrpDTV16yQ5rgAooYQPzmX5ZCE_Ps3Th8xGS1RI}
  SERVICE_ROLE_KEY: &service ${SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoiZXhwZXJpZW5jZS1sb2NhbCIsImlhdCI6MTc2MDAwMDAwMCwiZXhwIjoyMjQwMDAwMDAwfQ.kaE7Oz6dPADTlZv-MqQFgxHra8EzRzXUPSQQypgZSRE}

x-db-password: &dbpass ${POSTGRES_PASSWORD:-postgres}
x-jwt-secret: &jwt ${JWT_SECRET:-experience-local-dev-jwt-secret-not-for-production-use}

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    ports:
      - "54322:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      PGPASSWORD: *dbpass
      POSTGRES_PASSWORD: *dbpass
      JWT_EXP: 3600
    volumes:
      - ./docker/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./docker/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s  # the first boot runs Supabase's init scripts

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: *jwt
      # Locally: email + password, auto-confirmed, so anyone can get a token without SMTP.
      # Sign in with Apple is configured on the hosted project (needs the Apple Developer account).
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Media (photos, video) at /storage/v1, same API as the hosted project. Files live in the storage-data
  # volume (a Mac folder can't be used: the file backend needs extended attributes, which bind mounts lack).
  # Runs its own schema migrations on start, so ours can create buckets and policies on storage.objects.
  storage:
    image: supabase/storage-api:v1.81.0
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      ANON_KEY: *anon
      SERVICE_KEY: *service
      AUTH_JWT_SECRET: *jwt
      POSTGREST_URL: http://rest:3000
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      STORAGE_PUBLIC_URL: http://localhost:54321
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 1073741824  # 1 GB: 60 s of 4K video fits
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: experiences
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Applies supabase/migrations and supabase/seed.sql, publishes catalog drafts locally, then exits.
  # SAMPLE_DATA=true also loads the 8 hand-written samples in docker/sample-data.sql.
  # Needs auth healthy first: the schema references auth.users, which GoTrue creates.
  migrate:
    image: supabase/postgres:17.6.1.136
    depends_on:
      auth: { condition: service_healthy }
      storage: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: *dbpass
      PGDATABASE: postgres
      SAMPLE_DATA: ${SAMPLE_DATA:-false}
      LOCAL_PUBLISH_DRAFTS: ${LOCAL_PUBLISH_DRAFTS:-true}
      PGOPTIONS: -c client_min_messages=warning
    volumes:
      - ./supabase:/supabase:ro
      - ./docker/migrate.sh:/migrate.sh:ro
      - ./docker/sample-data.sql:/sample-data.sql:ro
    entrypoint: ["bash", "/migrate.sh"]
    restart: "no"

  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: 1000
      PGRST_JWT_SECRET: *jwt
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  functions:
    image: supabase/edge-runtime:v1.77.4
    restart: unless-stopped
    depends_on:
      rest: { condition: service_healthy }
    environment:
      <<: *keys
      SUPABASE_URL: http://gateway:8000
      SUPABASE_ANON_KEY: *anon
      SUPABASE_SERVICE_ROLE_KEY: *service
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      FUNCTIONS_DIR: /repo/supabase/functions
    volumes:
      # Edit a function and the next request runs the new code; no restart needed.
      # The repo root is mounted (not supabase/functions) so switching git branches can't leave a stale mount.
      - .:/repo:ro
      - deno-cache:/root/.cache/deno
    command: ["start", "--main-service", "/repo/docker/functions/main"]
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One URL for the app, like the hosted project: /auth/v1, /rest/v1, /functions/v1.
  gateway:
    image: nginx:1.29.3-alpine
    restart: unless-stopped
    depends_on:
      auth: { condition: service_healthy }
      rest: { condition: service_healthy }
      functions: { condition: service_healthy }
      storage: { condition: service_healthy }
    ports:
      - "54321:8000"
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  meta:
    image: supabase/postgres-meta:v0.100.0
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: *dbpass
      CRYPTO_KEY: local-dev-pg-meta-crypto-key-32chars

  # Table editor and SQL runner: http://localhost:54323
  studio:
    image: supabase/studio:2026.10.12-sha-3699278
    restart: unless-stopped
    depends_on:
      meta: { condition: service_started }
      gateway: { condition: service_started }
    ports:
      - "54323:3000"
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: *dbpass
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: local-dev-pg-meta-crypto-key-32chars
      PGRST_DB_SCHEMAS: public
      DEFAULT_ORGANIZATION_NAME: Experience
      DEFAULT_PROJECT_NAME: Local
      SUPABASE_URL: http://gateway:8000
      SUPABASE_PUBLIC_URL: http://localhost:54321
      SUPABASE_ANON_KEY: *anon
      SUPABASE_SERVICE_KEY: *service
      AUTH_JWT_SECRET: *jwt
      ENABLED_FEATURES_LOGS_ALL: "false"

  # Deno for tests and tooling, so collaborators don't need Deno installed. Not started by `up`.
  tools:
    image: denoland/deno:2.9.7
    profiles: ["tools"]
    working_dir: /app
    environment:
      SUPABASE_URL: http://gateway:8000
      SUPABASE_ANON_KEY: *anon
    volumes:
      - .:/app
      - deno-cache:/deno-dir
    entrypoint: []
    command: ["deno", "task", "test"]

volumes:
  db-data:
  storage-data:
  db-config:
  deno-cache:
