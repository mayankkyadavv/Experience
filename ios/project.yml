# XcodeGen spec. Generate the project with:  cd ios && xcodegen
# The .xcodeproj is generated and gitignored; edit this file instead.
name: Experience
options:
  bundleIdPrefix: com.experience
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"            # app target; ExperienceCore builds in Swift 6 mode
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""             # set your Apple Developer team ID to run on a device
    CODE_SIGN_STYLE: Automatic

packages:
  ExperienceCore:
    path: Packages/ExperienceCore
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0

targets:
  Experience:
    type: application
    platform: iOS
    sources:
      - path: Experience
    dependencies:
      - package: ExperienceCore
      - package: MapLibre
      - package: Supabase
        product: Supabase
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: Experience/Info.plist
      properties:
        CFBundleDisplayName: Experiences
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [BricolageGrotesque.ttf]
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true # let the globe run at 120 Hz on ProMotion
        NSCameraUsageDescription: Experiences uses the camera to capture moments you want to remember.
        NSMicrophoneUsageDescription: Experience records sound with your videos.
        NSLocationWhenInUseUsageDescription: Experience uses your location to show what's close and how long it takes to get there.
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        # Debug talks to the local Docker stack over http.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.experience.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"

  ExperienceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ExperienceUITests
    dependencies:
      - target: Experience
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.experience.app.uitests
        TEST_TARGET_NAME: Experience
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Experience:
    build:
      targets:
        Experience: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ExperienceUITests
